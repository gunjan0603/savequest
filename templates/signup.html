{% extends "base.html" %}{% block title %}Sign up — SaveQuest{% endblock %}
{% block content %}<section class="auth-page container"><div class="auth-card"><div class="eyebrow">FIRST STEP</div><h1>Start your saving quest.</h1><p class="muted">No bank connection. No guilt. Just progress.</p><form method="post" class="form"><label>Name<input type="text" name="name" required autocomplete="name"></label><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" required minlength="6" autocomplete="new-password"></label><button class="btn primary full" type="submit">Create account →</button></form><p class="switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p></div></section>{% endblock %}
