{% extends "base.html" %}{% block title %}New goal — SaveQuest{% endblock %}
{% block content %}<section class="form-page container"><a class="back" href="{{ url_for('dashboard') }}">← Dashboard</a><div class="form-card"><div class="eyebrow">NEW QUEST</div><h1>What are you saving for?</h1><p class="muted">Give your money a destination.</p><form method="post" class="form"><label>Goal name<input type="text" name="name" placeholder="e.g. New Laptop" required></label><label>Target amount (₹)<input type="number" name="target_amount" min="1" step="0.01" placeholder="30000" required></label><label>Deadline<input type="date" name="deadline" required></label><button class="btn primary full" type="submit">Create goal →</button></form></div></section>{% endblock %}
